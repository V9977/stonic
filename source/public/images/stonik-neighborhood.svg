<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 444 286" role="img" aria-labelledby="mapTitle mapDescription">
<title id="mapTitle">Карта района вокруг магазина «Стоник»</title>
<desc id="mapDescription">Салмышская и Волгоградская улицы, номера ближайших домов, остановка «Дон Кихот» и детский сад № 5. Жёлтым выделен дом 2 по Салмышской, где находится магазин «Стоник».</desc>
<style>
.compass-needle { transform-box: view-box; transform-origin: 70px 62px; animation: aim 4s ease-in-out infinite; }
.shop-ring { transform-box: view-box; transform-origin: 222px 143px; animation: orbit 9s linear infinite; }
.shop-badge { transform-box: fill-box; transform-origin: left center; animation: badge 3.8s ease-in-out infinite; }
.shop-building { animation: building-glow 3.8s ease-in-out infinite; }
.street-label { font: 700 13px Arial, sans-serif; paint-order: stroke; stroke: #152b28; stroke-width: 3.5px; stroke-linejoin: round; fill: #e6f3e4; }
.house-number { text-anchor: middle; dominant-baseline: middle; font: 700 12px Arial, sans-serif; fill: #dce8e8; paint-order: stroke; stroke: #263a44; stroke-width: 3px; stroke-linejoin: round; }
@keyframes aim { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(4deg); } }
@keyframes orbit { to { transform: rotate(360deg); } }
@keyframes badge { 0%, 100% { transform: translateY(0) skewY(-1deg); } 50% { transform: translateY(-3px) skewY(1deg); } }
@keyframes building-glow { 0%, 100% { opacity: .85; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .compass-needle, .shop-ring, .shop-badge, .shop-building { animation: none; }
}
</style>
